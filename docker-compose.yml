services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: biblionario
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: biblionario
    ports:
      - "5432:5432"
    volumes:
      - biblionario-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblionario"]
      interval: 5s
      retries: 10
volumes:
  biblionario-db:
