name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: biblionario
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: biblionario_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U biblionario" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://biblionario:test-password@localhost:5432/biblionario_test
      DIRECT_URL: postgresql://biblionario:test-password@localhost:5432/biblionario_test
      BIBLIONARIO_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
